name: PHP tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Syntax check
        run: |
          find . -maxdepth 2 -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Run regression tests
        run: php tests/run.php
